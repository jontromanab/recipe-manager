name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (pytest)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  frontend:
    name: Frontend tests and typecheck (vitest, tsc)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build # tsc typecheck + production build

  compose:
    name: docker compose smoke test
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - name: Start stack from a clean state
        run: docker compose up -d --build --wait
      - name: Check API, seed data and frontend
        run: |
          curl -fsS localhost:8080/api/health
          total=$(curl -fsS -H "Authorization: Bearer bistro-viewer" localhost:8080/api/recipes \
            | python3 -c "import sys, json; print(json.load(sys.stdin)['total'])")
          echo "bistro recipes: $total"
          test "$total" -eq 4
          code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer harbor-viewer" localhost:8080/api/recipes/1)
          echo "cross-org read: $code"
          test "$code" -eq 404
          curl -fsS localhost:8080/ | grep -q '<div id="root">'
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - run: docker compose down -v
        if: always()
